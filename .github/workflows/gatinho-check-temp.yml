name: Validar gatinho (temporário)

on:
  push:
    branches:
      - feat/missao-gatinho-desafio-2

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir enunciado e testes da missão 13
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("disciplinas/missoes/desafios/13-gatinho")
          assert (p / "README.md").is_file()
          assert (p / "solucoes/.gitkeep").is_file()
          for i in range(1, 4):
            entrada = (p / "testes" / f"entrada{i}.txt").read_text()
            esperado = (p / "testes" / f"saida{i}.txt").read_text()
            h, e = map(float, entrada.split())
            resultado = "Alcanca\n" if e >= h else f"Faltam: {h-e:.2f}\n"
            assert esperado == resultado, (i, resultado, esperado)
          print("Missão 13 e três testes conferidos.")
          PY
      - name: Verificar coleção de desafios existente
        run: python scripts/testar.py --todas
